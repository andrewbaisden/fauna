services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fauna
      POSTGRES_PASSWORD: fauna
      POSTGRES_DB: fauna
    ports:
      - "5432:5432"
    volumes:
      - fauna_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fauna -d fauna"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fauna_pg_data:
