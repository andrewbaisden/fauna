lifeStages:
  - slug: cub
    name: Cub
    sortOrder: 0
    description: Born in snow dens; twins are common; they stay with the mother for more than two years.
  - slug: subadult
    name: Subadult
    sortOrder: 1
    description: Independent but still learning to hunt on shifting ice.
  - slug: adult
    name: Adult
    sortOrder: 2
    description: Solitary except for mating and family groups of females with cubs.
adaptations:
  - title: Fur and fat insulation
    explanation: Dense fur and a thick adipose layer reduce heat loss in water and wind. Dark skin
      beneath translucent hair absorbs solar radiation.
behaviours:
  - category: FEEDING
    summary: Primarily hunts ringed and bearded seals from sea ice.
  - category: PARENTAL
    summary: Females fast in dens while nursing cubs, then lead them onto the ice.
